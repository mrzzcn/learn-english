<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" font-family="Noto Sans SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="380" height="250" rx="10" fill="#fffdf7"/>
  <!-- 舌位梯形：左边是舌前部，右边是舌后部；上面是舌位高（嘴张得小），下面是舌位低（嘴张得大） -->
  <polygon points="70,30 330,30 330,205 150,205" fill="none" stroke="#6d4c41" stroke-width="2"/>
  <line x1="97" y1="88" x2="330" y2="88" stroke="#6d4c41" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>
  <line x1="123" y1="147" x2="330" y2="147" stroke="#6d4c41" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>
  <line x1="200" y1="30" x2="240" y2="205" stroke="#6d4c41" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>
  <!-- 坐标说明 -->
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="92" y="20">前</text><text x="220" y="20">中</text><text x="330" y="20">后</text>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="end">
    <text x="60" y="34">高</text><text x="140" y="209">低</text>
  </g>
  <text x="352" y="120" font-size="11" fill="#57606a" text-anchor="middle" writing-mode="tb">舌位</text>
  <!-- 元音：红色不圆唇，蓝色圆唇 -->
  <g font-size="17" font-weight="bold" font-family="Noto Sans, Lucida Sans Unicode, Arial Unicode MS, sans-serif">
    <g fill="#e53935">
      <circle cx="80" cy="38" r="3.5"/><text x="88" y="44">iː</text>
      <circle cx="116" cy="62" r="3.5"/><text x="124" y="68">ɪ</text>
      <circle cx="112" cy="112" r="3.5"/><text x="120" y="118">e</text>
      <circle cx="140" cy="182" r="3.5"/><text x="148" y="188">æ</text>
      <circle cx="210" cy="104" r="3.5"/><text x="218" y="110">ɜː</text>
      <circle cx="216" cy="134" r="3.5"/><text x="224" y="140">ə</text>
      <circle cx="252" cy="168" r="3.5"/><text x="260" y="174">ʌ</text>
      <circle cx="296" cy="196" r="3.5"/><text x="258" y="200">ɑː</text>
    </g>
    <g fill="#1f5fa8">
      <circle cx="292" cy="60" r="3.5"/><text x="262" y="66">ʊ</text>
      <circle cx="322" cy="36" r="3.5"/><text x="290" y="42">uː</text>
      <circle cx="322" cy="124" r="3.5"/><text x="292" y="130">ɔː</text>
      <circle cx="322" cy="192" r="3.5"/><text x="300" y="228">ɒ</text>
    </g>
  </g>
  <line x1="322" y1="196" x2="310" y2="214" stroke="#1f5fa8" stroke-width="1"/>
  <g font-size="11">
    <circle cx="30" cy="232" r="4" fill="#e53935"/><text x="40" y="236" fill="#57606a">不圆唇</text>
    <circle cx="100" cy="232" r="4" fill="#1f5fa8"/><text x="110" y="236" fill="#57606a">圆唇</text>
  </g>
</svg>
